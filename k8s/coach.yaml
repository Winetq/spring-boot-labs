apiVersion: apps/v1
kind: Deployment
metadata:
  name: coach-deployment
  labels:
    app: coach
spec:
  selector:
    matchLabels:
      app: coach
  template:
    metadata:
      labels:
        app: coach
    spec:
      containers:
        - name: coach
          image: mcwynar/spring-boot-labs:coach
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
          ports:
            - name: http
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            timeoutSeconds: 3
            initialDelaySeconds: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            timeoutSeconds: 3
            initialDelaySeconds: 60
          env:
            - name: SERVER_PORT
              value: "8081"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres-password
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: postgres-coach-host
            - name: POSTGRES_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: postgres-coach-database
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: postgres-port
            - name: RABBIT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbit-secret
                  key: rabbit-user
            - name: RABBIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbit-secret
                  key: rabbit-password
            - name: RABBIT_HOST
              valueFrom:
                configMapKeyRef:
                  name: rabbit-config
                  key: rabbit-host
            - name: RABBIT_PORT
              valueFrom:
                configMapKeyRef:
                  name: rabbit-config
                  key: rabbit-port
---
apiVersion: v1
kind: Service
metadata:
  name: coach-service
spec:
  selector:
    app: coach
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081