apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-deployment
  labels:
    app: gateway
spec:
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: mcwynar/spring-boot-labs:gateway
          resources:
            requests:
              memory: 384Mi
              cpu: 100m
            limits:
              memory: 768Mi
              cpu: 500m
          ports:
            - containerPort: 8080
          env:
            - name: SERVER_PORT
              value: "8080"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60"
            - name: GATEWAY_HOST
              value: localhost
            - name: GATEWAY_PORT
              value: "30080"
            - name: COACH_HOST
              value: coach-service
            - name: COACH_PORT
              value: "8081"
            - name: SWIMMER_HOST
              value: swimmer-service
            - name: SWIMMER_PORT
              value: "8082"
            - name: CLIENT_HOST
              value: localhost
            - name: CLIENT_PORT
              value: "30000"
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30080