apiVersion: apps/v1
kind: Deployment
metadata:
  name: swimmer-deployment
  labels:
    app: swimmer
spec:
  selector:
    matchLabels:
      app: swimmer
  template:
    metadata:
      labels:
        app: swimmer
    spec:
      containers:
        - name: swimmer
          image: mcwynar/spring-boot-labs:swimmer
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 768Mi
              cpu: 500m
          ports:
            - name: http
              containerPort: 8082
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            timeoutSeconds: 3
            initialDelaySeconds: 60
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            timeoutSeconds: 3
            initialDelaySeconds: 60
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=60"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres-user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: postgres-password
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: postgres-swimmer-host
            - name: POSTGRES_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: postgres-swimmer-database
            - name: POSTGRES_PORT
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: postgres-port
            - name: RABBIT_USER
              valueFrom:
                secretKeyRef:
                  name: rabbit-secret
                  key: rabbit-user
            - name: RABBIT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: rabbit-secret
                  key: rabbit-password
            - name: RABBIT_HOST
              valueFrom:
                configMapKeyRef:
                  name: rabbit-config
                  key: rabbit-host
            - name: RABBIT_PORT
              valueFrom:
                configMapKeyRef:
                  name: rabbit-config
                  key: rabbit-port
---
apiVersion: v1
kind: Service
metadata:
  name: swimmer-service
spec:
  selector:
    app: swimmer
  ports:
    - protocol: TCP
      port: 8082
      targetPort: 8082
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: swimmer-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: swimmer-deployment
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60