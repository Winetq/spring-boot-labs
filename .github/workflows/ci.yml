name: CI/CD

on:
  push:

jobs:
  
  build-coach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and test coach
        run: mvn -B verify --file coach/pom.xml

  build-swimmer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and test swimmer
        run: mvn -B verify --file swimmer/pom.xml

  build-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build gateway
        run: mvn -B package -Dmaven.test.skip=true --file gateway/pom.xml

  docker:
    runs-on: ubuntu-latest
    needs: [ build-coach, build-swimmer, build-gateway ]
    if: github.ref == 'refs/heads/master'
    steps:
      - uses: actions/checkout@v6
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push coach image
        uses: docker/build-push-action@v7
        with:
          context: ./coach
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/spring-boot-labs:coach

      - name: Build and push swimmer image
        uses: docker/build-push-action@v7
        with:
          context: ./swimmer
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/spring-boot-labs:swimmer

      - name: Build and push gateway image
        uses: docker/build-push-action@v7
        with:
          context: ./gateway
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/spring-boot-labs:gateway

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./client
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/spring-boot-labs:frontend
